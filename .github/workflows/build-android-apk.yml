name: Build NEO CYBER Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NEO_CYBER_Android_v2.9.zip"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: neo-cyber-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f "NEO_CYBER_Android_v2.9.zip"
          unzip -t "NEO_CYBER_Android_v2.9.zip"

      - name: Extract v2.9 source
        run: |
          mkdir -p source
          unzip -q "NEO_CYBER_Android_v2.9.zip" -d source
          echo "Extracted source tree:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate main NEO CYBER Flutter application
        id: locate
        shell: bash
        run: |
          APP_DIR="source/neo_cyber_android"
          if [ ! -f "$APP_DIR/pubspec.yaml" ] || [ ! -f "$APP_DIR/lib/main.dart" ]; then
            echo "::error::Main NEO CYBER Flutter app not found at $APP_DIR."
            exit 1
          fi
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Building main application: $APP_DIR"

      - name: Apply screenshot-matched NEO CYBER dashboard
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          source = path.read_text()
          source = source.replace(
              "onOpenVulnerability: () => setState(() => index = 7)),",
              "onOpenVulnerability: () => setState(() => index = 7),\\n          onOpenDeviceControl: () => setState(() => index = 8)),",
              1,
          )
          if "onOpenDeviceControl:" not in source:
              raise SystemExit("Could not wire the existing Device Control page")

          old_nav = """      bottomNavigationBar: NavigationBar(
                backgroundColor: _panel,
                selectedIndex: index,
                onDestinationSelected: (v) => setState(() => index = v),
                destinations: const [
                  NavigationDestination(icon: Icon(Icons.dashboard_outlined), selectedIcon: Icon(Icons.dashboard), label: 'Home'),
                  NavigationDestination(icon: Icon(Icons.radar), label: 'Ports'),
                  NavigationDestination(icon: Icon(Icons.language), label: 'Web'),
                  NavigationDestination(icon: Icon(Icons.graphic_eq), label: 'Packets'),
                  NavigationDestination(icon: Icon(Icons.history), label: 'History'),
                  NavigationDestination(icon: Icon(Icons.info_outline), label: 'About'),
                  NavigationDestination(icon: Icon(Icons.swap_horiz), label: 'Proxy'),
                  NavigationDestination(icon: Icon(Icons.bug_report_outlined), label: 'Assess'),
                  NavigationDestination(icon: Icon(Icons.devices_other), label: 'Devices'),
                ],
              ),"""
          new_nav = """      bottomNavigationBar: NavigationBar(
                backgroundColor: const Color(0xFF080D18),
                indicatorColor: const Color(0xFF123B66),
                selectedIndex: <int>[0, 1, 4, 5].indexOf(index) < 0 ? 0 : <int>[0, 1, 4, 5].indexOf(index),
                onDestinationSelected: (v) => setState(() => index = <int>[0, 1, 4, 5][v]),
                destinations: const [
                  NavigationDestination(icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'Home'),
                  NavigationDestination(icon: Icon(Icons.bolt_outlined), selectedIcon: Icon(Icons.bolt), label: 'Quick Tools'),
                  NavigationDestination(icon: Icon(Icons.receipt_long_outlined), selectedIcon: Icon(Icons.receipt_long), label: 'Results'),
                  NavigationDestination(icon: Icon(Icons.settings_outlined), selectedIcon: Icon(Icons.settings), label: 'Settings'),
                ],
              ),"""
          nav_marker = "bottomNavigationBar:"
          nav_start = source.find(nav_marker)
          if nav_start < 0:
              raise SystemExit("Could not find the existing bottom navigation")
          widget_start = source.find("NavigationBar(", nav_start)
          if widget_start < 0:
              raise SystemExit("Could not find NavigationBar widget")
          open_paren = source.find("(", widget_start)
          depth = 0
          quote = None
          escaped = False
          widget_end = None
          for pos in range(open_paren, len(source)):
              ch = source[pos]
              if quote:
                  if escaped:
                      escaped = False
                  elif ch == "\\\\":
                      escaped = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in ("'", '"'):
                  quote = ch
              elif ch == "(":
                  depth += 1
              elif ch == ")":
                  depth -= 1
                  if depth == 0:
                      widget_end = pos + 1
                      break
          if widget_end is None:
              raise SystemExit("Could not safely find the end of NavigationBar")
          source = source[:widget_start] + new_nav.strip().replace("bottomNavigationBar: NavigationBar(", "NavigationBar(", 1) + source[widget_end:]

          a = source.index("class DashboardPage extends StatelessWidget {")
          b = source.index("class ScanRecord {", a)
          dashboard = r'''class DashboardPage extends StatelessWidget {
            final VoidCallback onOpenScanner;
            final VoidCallback onOpenWebCheck;
            final VoidCallback onOpenPackets;
            final VoidCallback onOpenProxy;
            final VoidCallback onOpenLocalProxy;
            final VoidCallback onOpenVulnerability;
            final VoidCallback onOpenDeviceControl;

            const DashboardPage({
              super.key,
              required this.onOpenScanner,
              required this.onOpenWebCheck,
              required this.onOpenPackets,
              required this.onOpenProxy,
              required this.onOpenLocalProxy,
              required this.onOpenVulnerability,
              required this.onOpenDeviceControl,
            });

            void _unavailable(BuildContext context, String title, String detail) {
              showDialog<void>(
                context: context,
                builder: (context) => AlertDialog(
                  backgroundColor: const Color(0xFF111A2B),
                  title: Text(title),
                  content: Text(detail),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text('CLOSE'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) => ListView(
              padding: const EdgeInsets.fromLTRB(16, 12, 16, 22),
              children: [
                Row(children: [
                  Container(
                    width: 42, height: 42,
                    decoration: BoxDecoration(
                      color: const Color(0xFF073B68),
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: _blue.withOpacity(.8)),
                      boxShadow: [BoxShadow(color: _blue.withOpacity(.18), blurRadius: 14)],
                    ),
                    child: const Icon(Icons.shield_moon, color: _blue, size: 27),
                  ),
                  const SizedBox(width: 11),
                  const Expanded(child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('NEO CYBER', style: TextStyle(fontSize: 21, fontWeight: FontWeight.w900, letterSpacing: 1.5)),
                      Text('MOBILE SECURITY PLATFORM', style: TextStyle(color: Colors.white54, fontSize: 9, letterSpacing: 1.3)),
                    ],
                  )),
                  Container(
                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                    decoration: BoxDecoration(
                      color: const Color(0xFF092B26),
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: const Color(0xFF25D69A).withOpacity(.6)),
                    ),
                    child: const Text('ANDROID', style: TextStyle(color: Color(0xFF55E6B3), fontSize: 9, fontWeight: FontWeight.bold)),
                  ),
                ]),
                const SizedBox(height: 16),
                Container(
                  height: 164,
                  padding: const EdgeInsets.all(18),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(17),
                    border: Border.all(color: _blue.withOpacity(.75)),
                    gradient: const LinearGradient(
                      begin: Alignment.topLeft, end: Alignment.bottomRight,
                      colors: [Color(0xFF092D50), Color(0xFF071321), Color(0xFF101B31)],
                    ),
                    boxShadow: [BoxShadow(color: _blue.withOpacity(.13), blurRadius: 18)],
                  ),
                  child: Stack(children: [
                    Positioned(right: 0, top: 0, bottom: 0,
                      child: Icon(Icons.public, size: 128, color: _blue.withOpacity(.13))),
                    const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('WELCOME TO YOUR SECURITY LAB', style: TextStyle(color: Color(0xFF73C9FF), fontSize: 9, letterSpacing: 1.4, fontWeight: FontWeight.bold)),
                        SizedBox(height: 12),
                        Text('THINK. TEST.\nPROTECT.', style: TextStyle(fontSize: 25, height: 1.05, fontWeight: FontWeight.w900, letterSpacing: 1.2)),
                        SizedBox(height: 9),
                        Text('Authorized security tools, directly on your Android device.', style: TextStyle(color: Colors.white70, fontSize: 11)),
                      ],
                    ),
                  ]),
                ),
                const SizedBox(height: 18),
                const Row(children: [
                  Text('SECURITY MODULES', style: TextStyle(fontSize: 12, fontWeight: FontWeight.w900, letterSpacing: 1.2)),
                  Spacer(),
                  Text('8 MODULES', style: TextStyle(color: Colors.white38, fontSize: 9)),
                ]),
                const SizedBox(height: 11),
                GridView.count(
                  crossAxisCount: 2,
                  shrinkWrap: true,
                  physics: const NeverScrollableScrollPhysics(),
                  mainAxisSpacing: 10,
                  crossAxisSpacing: 10,
                  childAspectRatio: 1.42,
                  children: [
                    _NeoModuleTile(icon: Icons.radar, title: 'Network Tools', subtitle: 'TCP scanning & discovery', onTap: onOpenScanner),
                    _NeoModuleTile(icon: Icons.security, title: 'Security Tools', subtitle: 'Web checks & assessment', onTap: onOpenVulnerability),
                    _NeoModuleTile(icon: Icons.wifi_tethering, title: 'Wireless Tools', subtitle: 'Bluetooth & device discovery', onTap: onOpenDeviceControl),
                    _NeoModuleTile(icon: Icons.devices_other, title: 'Device Control', subtitle: 'Manage paired devices', onTap: onOpenDeviceControl),
                    _NeoModuleTile(icon: Icons.bug_report_outlined, title: 'Penetration Testing', subtitle: 'Authorized assessment tools', onTap: onOpenVulnerability),
                    _NeoModuleTile(icon: Icons.extension, title: 'Extra Tools', subtitle: 'Packets, HTTP & proxy', onTap: onOpenPackets),
                    _NeoModuleTile(icon: Icons.graphic_eq, title: 'NEO PLUS AI', subtitle: 'AI assistant — planned', status: 'PLANNED', onTap: () => _unavailable(context, 'NEO PLUS AI', 'The AI assistant is not implemented in this build yet.')),
                    _NeoModuleTile(icon: Icons.description_outlined, title: 'Logs & Reports', subtitle: 'Saved assessment history', onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const HistoryPage()))),
                  ],
                ),
                const SizedBox(height: 14),
                Container(
                  padding: const EdgeInsets.all(14),
                  decoration: BoxDecoration(
                    color: const Color(0xFF0B211F),
                    borderRadius: BorderRadius.circular(14),
                    border: Border.all(color: const Color(0xFF28C997).withOpacity(.65)),
                  ),
                  child: const Row(children: [
                    Icon(Icons.check_circle_outline, color: Color(0xFF45DDAF), size: 25),
                    SizedBox(width: 10),
                    Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('SYSTEM STATUS', style: TextStyle(color: Color(0xFF69E5BB), fontWeight: FontWeight.w900, fontSize: 11, letterSpacing: 1)),
                      SizedBox(height: 3),
                      Text('NEO CYBER app active • Android session', style: TextStyle(color: Colors.white70, fontSize: 10)),
                    ])),
                    Text('READY', style: TextStyle(color: Color(0xFF69E5BB), fontSize: 9, fontWeight: FontWeight.bold)),
                  ]),
                ),
                const SizedBox(height: 10),
                const Text('Use only devices and systems you own or have explicit permission to assess.', textAlign: TextAlign.center, style: TextStyle(color: Colors.white38, fontSize: 9)),
              ],
            );
          }

          class _NeoModuleTile extends StatelessWidget {
            final IconData icon;
            final String title;
            final String subtitle;
            final String status;
            final VoidCallback onTap;

            const _NeoModuleTile({
              required this.icon, required this.title, required this.subtitle,
              required this.onTap, this.status = 'OPEN',
            });

            @override
            Widget build(BuildContext context) => Material(
              color: const Color(0xFF0D1728),
              borderRadius: BorderRadius.circular(13),
              child: InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(13),
                child: Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(13),
                    border: Border.all(color: _blue.withOpacity(.55)),
                    boxShadow: [BoxShadow(color: _blue.withOpacity(.07), blurRadius: 12)],
                  ),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    Row(children: [
                      Icon(icon, color: _blue, size: 23),
                      const Spacer(),
                      Icon(Icons.arrow_forward_ios, color: _blue.withOpacity(.8), size: 12),
                    ]),
                    const Spacer(),
                    Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w800)),
                    const SizedBox(height: 3),
                    Text(subtitle, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white54, fontSize: 9, height: 1.2)),
                    const SizedBox(height: 5),
                    Text(status, style: const TextStyle(color: Color(0xFF62BFFF), fontSize: 8, fontWeight: FontWeight.bold, letterSpacing: .8)),
                  ]),
                ),
              ),
            );
          }

          '''
          source = source[:a] + dashboard + source[b:]
          path.write_text(source)
          print("Applied screenshot-style dashboard, eight module tiles, honest system status, and four-item navigation.")
          PY
          echo "Dashboard source updated; formatting and analysis run after Flutter setup."
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Generate missing Android project files
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name neo_cyber .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              (Path("android/app/build.gradle.kts"), "kotlin"),
              (Path("android/app/build.gradle"), "groovy"),
          ]
          existing = [(path, kind) for path, kind in candidates if path.is_file()]
          if not existing:
              raise SystemExit("Android app Gradle file not found")

          updated = False
          for path, kind in existing:
              lines = path.read_text().splitlines()
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if kind == "kotlin" and stripped.startswith("compileSdk"):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "compileSdk = 36"
                      updated = True
                      break
                  if kind == "groovy" and stripped.startswith("compileSdkVersion"):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "compileSdkVersion 36"
                      updated = True
                      break
                  if kind == "groovy" and stripped.startswith("compileSdk"):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "compileSdk 36"
                      updated = True
                      break
              if updated:
                  path.write_text("\n".join(lines) + "\n")
                  print(f"Set Android compileSdk to 36 in {path}")
                  break

          if not updated:
              for path, _ in existing:
                  print(f"--- {path} ---")
                  print(path.read_text())
              raise SystemExit("Could not find a compileSdk declaration in the generated Gradle file")
          PY

      - name: Declare release network and Bluetooth permissions
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")
          source = manifest.read_text()
          additions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
          ]
          match = re.search(r'<manifest\b[^>]*>', source)
          if not match:
              raise SystemExit("Could not locate the manifest root element")
          existing = source
          missing = [line for line in additions
                     if re.search(r'android:name="' + re.escape(
                         re.search(r'android:name="([^"]+)"', line).group(1)
                     ) + r'"', existing) is None]
          if missing:
              source = source[:match.end()] + "\n" + "\n".join(missing) + source[match.end():]
              manifest.write_text(source)
          print("Verified release manifest permissions:")
          for line in additions:
              if line in source:
                  print(line.strip())
              else:
                  raise SystemExit(f"Required permission missing after patch: {line}")
          PY
          echo "--- Android release manifest ---"
          sed -n '1,35p' android/app/src/main/AndroidManifest.xml

      - name: Install Flutter dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: flutter pub get

      - name: Set file_picker Android compile SDK to API 36
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(cache.glob("file_picker-*/android/build.gradle"))
          candidates += list(cache.glob("file_picker-*/android/build.gradle.kts"))
          if not candidates:
              raise SystemExit(f"file_picker Gradle file not found under {cache}")

          for path in candidates:
              lines = path.read_text().splitlines()
              matches = [i for i, line in enumerate(lines)
                         if "compileSdk" in line and not line.lstrip().startswith("//")]
              if not matches:
                  print(f"--- contents of {path} ---")
                  print(path.read_text())
                  raise SystemExit(f"No compileSdk setting found in {path}")
              for i in matches:
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  if path.suffix == ".kts":
                      lines[i] = indent + "compileSdk = 36"
                  else:
                      lines[i] = indent + "compileSdkVersion 36"
              path.write_text("\n".join(lines) + "\n")
              print(f"Patched {path}")
              for i in matches:
                  print(f"Verified line {i+1}: {lines[i].strip()}")

          print("file_picker compile SDK patch completed.")
          PY
          echo "---- verified file_picker Gradle setting ----"
          grep -n -E 'compileSdk' "$HOME"/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*
      - name: Apply verified Dart compatibility fixes
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("lib/local_proxy.dart")
          proxy_text = proxy.read_text()
          material_import = "import 'package:flutter/material.dart';"
          if material_import not in proxy_text:
              proxy.write_text(material_import + "\n" + proxy_text)
              print("Added missing Flutter Material import to local_proxy.dart")
          else:
              print("Flutter Material import already present")

          assessment = Path("lib/vulnerability_assessment.dart")
          assessment_text = assessment.read_text()
          invalid = "..maxRedirects = 5;"
          if invalid in assessment_text:
              assessment_text = assessment_text.replace(invalid, ";")
              assessment.write_text(assessment_text)
              print("Removed invalid HttpClient.maxRedirects cascade; Dart HttpClientRequest retains its default redirect limit")
          elif "maxRedirects" in assessment_text:
              raise SystemExit("Unexpected maxRedirects code shape; refusing to apply an unsafe automatic edit")
          else:
              print("No invalid HttpClient.maxRedirects setting found")

          print("Compatibility patch complete")
          PY
          dart format lib/local_proxy.dart lib/vulnerability_assessment.dart

      - name: Repair verified main.dart syntax errors
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          source = path.read_text()

          old_device_close = "    ]))))),"
          new_device_close = "    ])))),"
          if old_device_close in source:
              source = source.replace(old_device_close, new_device_close, 1)
              print("Removed the extra closing parenthesis in the device inventory widget")
          elif new_device_close in source:
              print("Device inventory closing sequence already repaired")
          else:
              raise SystemExit("Could not identify the device inventory closing sequence; refusing a blind edit")

          old_port_row = "    Row(children: [Expanded(child: TextField(controller: start, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Start port'))), const SizedBox(width: 10), Expanded(child: TextField(controller: end, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'End port'))]),"
          new_port_row = """    Row(
              children: [
                Expanded(
                  child: TextField(
                    controller: start,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(labelText: 'Start port'),
                  ),
                ),
                const SizedBox(width: 10),
                Expanded(
                  child: TextField(
                    controller: end,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(labelText: 'End port'),
                  ),
                ),
              ],
            ),"""
          if old_port_row in source:
              source = source.replace(old_port_row, new_port_row, 1)
              print("Rewrote the TCP port range row with balanced widget delimiters")
          elif new_port_row in source:
              print("TCP port range row already repaired")
          else:
              raise SystemExit("Could not identify the TCP port range row; refusing a blind edit")

          path.write_text(source)
          PY
          dart format lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lib/main.dart")
          source = path.read_text()
          unused = "import 'dart:math';\\n"
          if unused in source:
              path.write_text(source.replace(unused, "", 1))
              print("Removed unused dart:math import")
          PY
          set +e
          dart analyze --format machine lib/main.dart > analyze-results.txt
          analyze_status=$?
          set -e
          cat analyze-results.txt
          if grep -q '^ERROR|' analyze-results.txt; then
            echo "::error::Dart analyzer reported errors"
            exit 1
          fi
          echo "No Dart errors found (analyzer exit code: $analyze_status; warnings/info are non-blocking)"

      - name: Diagnose Dart syntax errors
        if: always()
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          echo '--- main.dart lines 260-285 ---'
          nl -ba lib/main.dart | sed -n '260,285p'
          echo '--- main.dart lines 1345-1370 ---'
          nl -ba lib/main.dart | sed -n '1345,1370p'

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: flutter build apk --release

      - name: Verify APK output
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-cyber-v2.9-release-apk
          path: ${{ steps.locate.outputs.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
