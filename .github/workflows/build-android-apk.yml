name: Build NEO CYBER Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NEO_CYBER_Android_v2.9.zip"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: neo-cyber-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f "NEO_CYBER_Android_v2.9.zip"
          unzip -t "NEO_CYBER_Android_v2.9.zip"

      - name: Extract v2.9 source
        run: |
          mkdir -p source
          unzip -q "NEO_CYBER_Android_v2.9.zip" -d source
          echo "Extracted source tree:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate main NEO CYBER Flutter application
        id: locate
        shell: bash
        run: |
          APP_DIR="source/neo_cyber_android"
          if [ ! -f "$APP_DIR/pubspec.yaml" ] || [ ! -f "$APP_DIR/lib/main.dart" ]; then
            echo "::error::Main NEO CYBER Flutter app not found at $APP_DIR."
            exit 1
          fi
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Building main application: $APP_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Generate missing Android project files
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name neo_cyber .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Install Flutter dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: flutter pub get

      - name: Apply verified Dart compatibility fixes
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("lib/local_proxy.dart")
          proxy_text = proxy.read_text()
          material_import = "import 'package:flutter/material.dart';"
          if material_import not in proxy_text:
              proxy.write_text(material_import + "\n" + proxy_text)
              print("Added missing Flutter Material import to local_proxy.dart")
          else:
              print("Flutter Material import already present")

          assessment = Path("lib/vulnerability_assessment.dart")
          assessment_text = assessment.read_text()
          invalid = "..maxRedirects = 5;"
          if invalid in assessment_text:
              assessment_text = assessment_text.replace(invalid, ";")
              assessment.write_text(assessment_text)
              print("Removed invalid HttpClient.maxRedirects cascade; Dart HttpClientRequest retains its default redirect limit")
          elif "maxRedirects" in assessment_text:
              raise SystemExit("Unexpected maxRedirects code shape; refusing to apply an unsafe automatic edit")
          else:
              print("No invalid HttpClient.maxRedirects setting found")

          print("Compatibility patch complete")
          PY
          dart format lib/local_proxy.dart lib/vulnerability_assessment.dart

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: flutter build apk --release

      - name: Verify APK output
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-cyber-v2.9-release-apk
          path: ${{ steps.locate.outputs.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
